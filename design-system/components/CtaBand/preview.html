<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>CtaBand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{background:var(--surface);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;padding:var(--space-6)}
*{box-sizing:border-box}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}

.band{background:var(--night);color:var(--on-night);border-radius:var(--radius-xl);padding:var(--space-10) var(--space-16);display:flex;align-items:center;justify-content:space-between;gap:var(--space-10);position:relative;overflow:hidden}
.band h2{margin:0 0 var(--space-3);font:500 36px/40px var(--font-sans);letter-spacing:-.03em;max-width:520px}
.band p{margin:0;color:var(--on-night-muted);font-size:16px;line-height:1.5;max-width:520px}
.btn{font:500 15px/1 var(--font-sans);padding:14px 22px;border-radius:var(--radius-md);background:var(--on-night);color:var(--night);white-space:nowrap;position:relative}
.mark{position:absolute;right:-40px;top:-50px;opacity:.9}

</style></head><body>
<div class="band">
<div class="mark"><svg width="180" height="180" viewBox="0 0 100 100" aria-hidden="true"><path d="M37.06 1.70 L51.11 41.57 L66.50 21.42 L56.74 44.83 L98.30 37.06 L58.43 51.11 L78.58 66.50 L55.17 56.74 L62.94 98.30 L48.89 58.43 L33.50 78.58 L43.26 55.17 L1.70 62.94 L41.57 48.89 L21.42 33.50 L44.83 43.26 Z" fill="var(--spark)"/></svg></div>
<div><h2>Tell me what you're trying to move.</h2><p>I'll tell you honestly whether I'm the right person, and who is if I'm not.</p></div>
<span class="btn">Start a conversation</span>
</div>
</body></html>
