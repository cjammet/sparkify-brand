<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Button</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{background:var(--surface);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;padding:var(--space-6)}
*{box-sizing:border-box}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}

.row{display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap}
.btn{font:500 15px/1 var(--font-sans);padding:14px 22px;border-radius:var(--radius-md);border:0;cursor:pointer;display:inline-flex;align-items:center;gap:var(--space-2)}
.primary{background:var(--action);color:var(--on-action)}
.secondary{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--border-control)}
.quiet{background:transparent;color:var(--accent);padding:14px 4px}
.btn:focus-visible{outline:none;box-shadow:var(--focus-ring)}

</style></head><body>
<div class="row">
<button class="btn primary">Start a conversation</button>
<button class="btn secondary">See the work</button>
<button class="btn quiet">Read the thinking &rarr;</button>
</div>
</body></html>
