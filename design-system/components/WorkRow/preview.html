<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>WorkRow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{background:var(--surface);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;padding:var(--space-6)}
*{box-sizing:border-box}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}

.list{background:var(--surface-raised);border-radius:var(--radius-lg);box-shadow:var(--hairline);padding:0 var(--space-7)}
.row{display:grid;grid-template-columns:160px 1fr auto;gap:var(--space-6);align-items:baseline;padding:var(--space-6) 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.who{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.what{font:500 19px/1.35 var(--font-sans);letter-spacing:-.01em}
.what span{display:block;font:400 15px/1.5 var(--font-sans);color:var(--ink-muted);margin-top:4px}
.tag{font-size:13px;color:var(--ink-muted);white-space:nowrap}

</style></head><body>
<div class="list">
<div class="row"><span class="who">[Client]</span><div class="what">Built a weekly eminence engine for a founder<span>From notes in a phone to [n] bylined pieces in a quarter.</span></div><span class="tag">Eminence</span></div>
<div class="row"><span class="who">CR8-OS</span><div class="what">An operating system for content teams working with AI<span>Open tooling that keeps humans in the editorial seat.</span></div><span class="tag">AI enablement</span></div>
</div>
</body></html>
