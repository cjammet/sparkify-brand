<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Chip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{background:var(--surface);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;padding:var(--space-6)}
*{box-sizing:border-box}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}

.row{display:flex;gap:var(--space-2);flex-wrap:wrap}
.chip{font:500 14px/1 var(--font-sans);padding:10px 16px;border-radius:var(--radius-pill);background:var(--surface-raised);color:var(--ink-muted);box-shadow:var(--hairline)}
.chip.on{background:var(--action);color:var(--on-action);box-shadow:none}

</style></head><body>
<div class="row">
<span class="chip on">All work</span><span class="chip">Eminence</span><span class="chip">AI enablement</span><span class="chip">Amplification</span><span class="chip">Advisory</span>
</div>
</body></html>
