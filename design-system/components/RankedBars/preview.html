<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>RankedBars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{background:var(--surface);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;padding:var(--space-6)}
*{box-sizing:border-box}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}

.card{background:var(--surface-raised);border-radius:var(--radius-lg);box-shadow:var(--hairline);padding:var(--space-6)}
.card h4{margin:var(--space-2) 0 var(--space-4);font:500 18px/1.3 var(--font-sans)}
.r{display:grid;grid-template-columns:150px 1fr 56px;gap:var(--space-3);align-items:center;margin-top:10px;font-size:14px;color:var(--ink-muted)}
.bar{height:10px;border-radius:var(--radius-pill);background:var(--viz-3)}
.r.lead .bar{background:var(--spark)}
.r.lead{color:var(--ink);font-weight:500}
.v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}

</style></head><body>
<div class="card"><span class="eyebrow">Top posts by engagement</span><h4>What people actually responded to</h4>
<div class="r lead"><span>[Post title one]</span><div class="bar" style="width:100%"></div><span class="v">[000]</span></div>
<div class="r"><span>[Post title two]</span><div class="bar" style="width:72%"></div><span class="v">[000]</span></div>
<div class="r"><span>[Post title three]</span><div class="bar" style="width:55%"></div><span class="v">[000]</span></div>
<div class="r"><span>[Post title four]</span><div class="bar" style="width:38%"></div><span class="v">[000]</span></div>
</div>
</body></html>
