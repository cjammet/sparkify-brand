<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sparkify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-sans); overflow:hidden; -webkit-font-smoothing:antialiased; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .deep { fill:var(--ink); }
  .indigo { fill:var(--accent); }
  .peri { fill:var(--viz-3); }
  .mist { fill:var(--viz-4); }
  .spark { fill:var(--spark); }
  .panel { rx:var(--radius-xl); }
  .card { rx:var(--radius-lg); }
  .words { position:absolute; left:var(--space-10); bottom:var(--space-10); max-width:440px; }
  .name { margin:0; font-size:88px; line-height:.92; font-weight:500; letter-spacing:-.04em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      ink 192x284 slab bled off the top (Midnight, the identity) · accent 160x192 (Indigo) · viz-4 96x172 bled off top and right (Mist) · viz-3 96x96 (Periwinkle) · spark only as the motif, never a block (about 38% of 960x288)
  arrangement one tall Midnight slab with satellites stepping down to the right, bottoms on one line space-6 above the edge, space-4 gutters
  pattern     the literal motif row: the eight-point spark, from "the spark is the only illustrative element": one large spark cut into the slab, two small ones on the satellites, all in spark
  scales      sides in space-4 / space-6 multiples; gutters space-4; corners radius-xl on the slab and indigo panel, radius-lg on the small cards
-->
<rect class="deep panel" x="24" y="-20" width="192" height="284" rx="20"/>
<rect class="indigo panel" x="232" y="72" width="160" height="192" rx="20"/>
<rect class="mist card" x="408" y="-20" width="96" height="172" rx="16"/>
<rect class="peri card" x="408" y="168" width="96" height="96" rx="16"/>

<g transform="translate(424 184) scale(0.24)"><path class="spark" d="M37.06 1.70 L51.11 41.57 L66.50 21.42 L56.74 44.83 L98.30 37.06 L58.43 51.11 L78.58 66.50 L55.17 56.74 L62.94 98.30 L48.89 58.43 L33.50 78.58 L43.26 55.17 L1.70 62.94 L41.57 48.89 L21.42 33.50 L44.83 43.26 Z"/></g>
</svg>
</div>
<div class="words">
<h1 class="name">Sparkify</h1>
<p class="tag">Advisory and eminence systems by Christophe Jammet. Marketing that respects people.</p>
</div>
</div>

</html>
