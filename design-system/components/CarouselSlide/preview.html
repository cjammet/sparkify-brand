<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{background:var(--surface);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;padding:var(--space-6)}
*{box-sizing:border-box}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}

.row{display:flex;gap:var(--space-4)}
.s{width:270px;height:338px;border-radius:var(--radius-md);padding:var(--space-6);display:flex;flex-direction:column;position:relative;overflow:hidden}
.cover{background:var(--night);color:var(--on-night)}
.cover h3{margin:auto 0 var(--space-3);font:500 28px/1.05 var(--font-sans);letter-spacing:-.03em}
.cover .by{font-size:12px;color:var(--on-night-muted)}
.cover .mk{position:absolute;right:-30px;top:-30px}
.pt{background:var(--surface-raised);box-shadow:var(--hairline)}
.pt .n{font:500 56px/1 var(--font-sans);color:var(--accent);letter-spacing:-.04em}
.pt h3{margin:var(--space-4) 0 var(--space-2);font:500 22px/1.15 var(--font-sans);letter-spacing:-.02em}
.pt p{margin:0;font-size:14px;line-height:1.5;color:var(--ink-muted)}
.foot{margin-top:auto;display:flex;justify-content:space-between;font-size:11px;color:var(--ink-muted)}
.cover .foot{color:var(--on-night-muted)}

</style></head><body>

</div>
